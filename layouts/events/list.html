{{ define "main" }}

    <h1>{{ .Title }}</h1>

    <ul>
        {{ range sort .Pages "Params.startdate" "asc" }}
            {{ if (time.AsTime .Params.enddate).Before now }}
                <li>
                    <a href="{{ .RelPermalink }}">
                        {{ (time.AsTime .Params.startdate).Format "02 Jan, 2006" }} - {{ .Title }}
                    </a>
                </li>
            {{ end }}
        {{ end }}
    </ul>
{{ end }}
